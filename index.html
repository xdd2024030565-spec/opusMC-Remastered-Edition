<script>
  // the loading bar: the game's scripts as they arrive (how many there are: counted in this page itself), then the
  // start-up (textures, the title world) creeping on until the title screen is up
  (function () {
    var bar = document.querySelector('#bootbar i'), txt = document.getElementById('boottext'), total = 90, got = 0, shown = 0;
    // (the tags counted with a pattern that is not itself one: the plain one counted this line too, one more than there
    // are - the bar waited at 84 % for a script that never came, all through the start-up, 11-10; the mods' scripts,
    // written in by mods.js, are added as they are written: self.BOOT_EXTRA)
    var tag = new RegExp('<scr' + 'ipt src=', 'g');
    try { fetch(location.href, { cache: 'force-cache' }).then(function (r) { return r.text(); }).then(function (t) { var n = (t.match(tag) || []).length; if (n) total = n; }).catch(function () { }); } catch (e) { }
    document.addEventListener('load', function (e) { if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) got++; }, true);
    // (all the scripts in - window load - is the end of loading whatever was counted)
    var loaded = false; addEventListener('load', function () { loaded = true; }); total = 1; got = 1;
    var t0 = 0;
    // (drawn again by the game too as it starts up a step - game.js init: self.BOOT_STEP, BOOT_DRAW)
    var draw = self.BOOT_DRAW = function () {
      var b = document.getElementById('boot'); if (!b || b.style.display === 'none') return false;
      var all = total + (self.BOOT_EXTRA || 0), more = !loaded && got < all;
      var want = more ? 85 * got / all : 85 + 14 * (1 - Math.exp(-(performance.now() - (t0 || (t0 = performance.now()))) / 4000));
      shown = Math.max(shown, Math.min(99, want));
      bar.style.width = shown.toFixed(1) + '%';
      txt.textContent = (more ? '正在加载… ' : (self.BOOT_STEP || '正在准备世界') + '… ') + Math.floor(shown) + '%';
      return true;
    };
    (function step() { if (draw()) setTimeout(step, 100); })();

    // opusMC Remastered Edition: 真实进度接口（云存档载入 / 游戏初始化各阶段调用）
    // 百分比只增不减；__bootCreep 在等待期间缓慢爬升，给"确实在推进"的反馈。
    var creepTimer = null, creepTo = 0;
    self.__bootProgress = function (p, label) {
      var b = document.getElementById('boot'); if (!b || b.style.display === 'none') return;
      shown = Math.max(shown, Math.min(100, p));
      bar.style.width = shown.toFixed(1) + '%';
      txt.textContent = (label || self.BOOT_STEP || '正在准备世界') + '… ' + Math.floor(shown) + '%';
    };
    self.__bootCreep = function (to, label) {
      self.__bootStop();
      creepTo = Math.max(creepTo, to);
      creepTimer = setInterval(function () {
        if (shown >= creepTo - 1) { self.__bootStop(); return; }
        self.__bootProgress(Math.min(creepTo, shown + 1), label);
      }, 220);
    };
    self.__bootStop = function () { if (creepTimer) { clearInterval(creepTimer); creepTimer = null; } };
  })();
</script>

(function () {

  var cv = document.getElementById('yymc-bg');
  var stage = document.getElementById('stage') || document.body;
  if (!cv) {

  }
  cv.style.zIndex = '0';
  cv.style.pointerEvents = 'none';
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize() {
    var r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));

    for (var x = 0; x <= W + step; x += step) {

    ctx.ellipse(x - s * 0.65, y + s * 0.1, s * 0.5, s * 0.22, 0, 0, 6.2832);
    ctx.fill(); ctx.globalAlpha = 1;

    sky.addColorStop(0, '#0b1a33');
    sky.addColorStop(0.35, '#274b74');
    sky.addColorStop(0.62, '#e07a4a');
    sky.addColorStop(0.78, '#f2b06a');
    sky.addColorStop(1, '#2a1c22');

    glow.addColorStop(0.4, 'rgba(255,120,70,0.18)');
    glow.addColorStop(1, 'rgba(255,90,60,0)');

      ctx.globalAlpha = 0.10 * (1 - k / 30);
      ctx.fillStyle = '#ffd9a0';
      ctx.fillRect(xx, yy, ww, 1.5);

    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    }
  } catch (e) {}

  draw(performance.now());
  window.__YYMC_DRAW = draw;
})();

<script>
/* ==== YYMC 模组导入 ==== */
(function () {
  if (window.__YYMC_IMPORT__) return;
  window.__YYMC_IMPORT__ = true;

  function guessId(name) {
    var s = String(name || '').toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
    s = s.replace(/^[^a-z]+/, '');
    return s || 'mymod';
  }

  function parsePack(zip, fallbackId) {
    var dec = new TextDecoder('utf-8');
    var out = { id: fallbackId, name: fallbackId, dataJs: '', codeJs: '', textures: {} };
    for (var path in zip) {
      var u8 = zip[path];
      if (/(^|\/)mod\.json$/i.test(path)) {
        try {
          var j = JSON.parse(dec.decode(u8));
          if (j.id) out.id = guessId(j.id);
          if (j.name) out.name = j.name;
        } catch (e) {}
      } else if (/(^|\/)data\.js$/i.test(path)) {
        out.dataJs = dec.decode(u8);
      } else if (/(^|\/)code\.js$/i.test(path)) {
        out.codeJs = dec.decode(u8);
      } else if (/\.png$/i.test(path)) {
        var bin = '', i;
        for (i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
        out.textures[path.split('/').pop()] = 'data:image/png;base64,' + btoa(bin);
      }
    }
    return out;
  }

  function save(mod) {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('yymc-usermods') || '[]') || []; } catch (e) {}
    list = list.filter(function (m) { return m.id !== mod.id; });
    list.push(mod);
    try {
      localStorage.setItem('yymc-usermods', JSON.stringify(list));
    } catch (e) {
      alert('保存失败：模组太大（贴图超过约 4MB）。减少贴图后再试。');
      return;
    }
    alert('已导入「' + mod.name + '」。页面会重新加载，加载完成后模组生效。');
    location.reload();
  }

  window.__YYMC_IMPORT = function () {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.yymc,.zip,.js';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var rd = new FileReader();
      if (/\.js$/i.test(f.name)) {
        rd.onload = function () {
          var nm = f.name.replace(/\.js$/i, '');
          save({ id: guessId(nm), name: nm, dataJs: '', codeJs: String(rd.result), textures: {} });
        };
        rd.readAsText(f);
      } else {
        rd.onload = function () {
          try {
            var zip = fflate.unzipSync(new Uint8Array(rd.result));
            var mod = parsePack(zip, guessId(f.name.replace(/\.[^.]+$/, '')));
            if (!mod.dataJs && !mod.codeJs) throw new Error('包里没有 data.js 或 code.js');
            save(mod);
          } catch (e) {
            alert('导入失败：' + (e && e.message || e));
          }
        };
        rd.readAsArrayBuffer(f);
      }
    };
    inp.click();
  };

  function hook() {
    if (typeof ModsScreen === 'undefined' || !ModsScreen.prototype || !ModsScreen.prototype.layout) {
      return setTimeout(hook, 300);
    }
    var lay = ModsScreen.prototype.layout;
    ModsScreen.prototype.layout = function () {
      var r = lay.call(this);
      try {
        var u = this.game.ui, cx = u.w / 2;
        var has = false;
        for (var i = 0; i < this.widgets.length; i++) if (this.widgets[i].__yymc) has = true;
        if (!has) {
          this.widgets.push({
            x: cx - 110, y: u.h - 46, w: 220, h: 20, glowBlue: true, __yymc: true,
            label: '导入模组包（.yymc / .js）',
            onClick: function () { window.__YYMC_IMPORT(); }
          });
        }
      } catch (e) {}
      return r;
    };
  }
  hook();
})();

</script>

<script>

  // 隐藏原版底部的常驻 AI 标识（保留启动时的那一个显式标识）
  try {
    var hideOld = function () {
      var els = document.querySelectorAll('[data-aigc], .aigc-badge');
      for (var i = 0; i < els.length; i++) els[i].style.display = 'none';
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hideOld); else hideOld();
    setTimeout(hideOld, 1500);
  } catch (e) {}
})();

</script>

</body>
</html>
